name: Installer le code
on:
  push:
    paths: ['*.zip', '.github/workflows/installer.yml']
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for f in *.zip; do
            unzip -o -q "$f"
            rm "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Mise a jour du code" && git push)
